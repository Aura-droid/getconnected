# Enable AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin style
kotlin.code.style=official

# Gradle / Kotlin daemon memory
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m

# Caching & parallel builds
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.tooling.parallel=true

# Set Gradle Java Home to JDK 21 (prevents Java 25 compatibility issue with Kotlin DSL parser)
org.gradle.java.home=C\:/Users/admin/.jdks/jbr-21.0.11

# Dependency constraints: android.dependency.excludeLibraryComponentsFromConstraints
# is deprecated in AGP 9 and removed in AGP 10; this is the supported replacement.
android.dependency.useConstraints=false

